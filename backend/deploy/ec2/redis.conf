bind 0.0.0.0
port 6379
# Isolated Docker bridge only; do not publish 6379 or allow untrusted containers.
protected-mode no
dir /data
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 900 1
save 300 10
maxmemory 256mb
# Sessions share this datastore: never silently evict them as cache entries.
maxmemory-policy noeviction
logfile ""
