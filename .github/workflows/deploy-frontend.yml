name: Deploy SutrAI Frontend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sutrai-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Build and publish frontend only
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
        run: |
          set -euo pipefail
          for name in VITE_FIREBASE_API_KEY VITE_RAZORPAY_KEY_ID VITE_SERVER_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload frontend to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${S3_BUCKET:-}" ]; then
            echo "::error::Missing GitHub Actions secret: S3_BUCKET"
            exit 1
          fi
          aws s3 sync frontend/dist/ "s3://${S3_BUCKET}/" --delete --only-show-errors

      - name: Invalidate CloudFront
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFRONT_DISTRIBUTION_ID:-}" ]; then
            echo "::error::Missing GitHub Actions secret: CLOUDFRONT_DISTRIBUTION_ID"
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
